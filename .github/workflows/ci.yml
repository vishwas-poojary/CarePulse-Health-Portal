name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-build:
    name: Lint, Spell Check, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Spell Checker (cspell)
        run: npm run lint:spell

      - name: Build Astro Website
        run: npm run build

  security-scan:
    name: Security Scans (Gitleaks, Semgrep, Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks (Secret Detection)
        run: |
          docker run --rm -v "${{ github.workspace }}:/path" zricethezav/gitleaks:latest detect --verbose --source="/path"

      - name: Run Semgrep (SAST)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep semgrep scan --config "p/default" --config "p/javascript" --config "p/typescript" --config "p/owasp-top-ten" --error

      - name: Run Trivy (Vulnerability & Misconfig)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" aquasec/trivy:latest fs --config /src/trivy.yaml /src

